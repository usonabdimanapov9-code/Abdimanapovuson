<!DOCTYPE html>
<html>
  <head>
    <title>Hello, World!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
  <style type="text/css" media="all">
     * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    max-width: 500px;
}

.card {
    background: white;
    border-radius: 25px;
    padding: 40px 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    min-height: 420px;
}

.front h1 {
    font-size: 80px;
    margin-bottom: 20px;
}

.front h2 {
    color: #e84375;
    margin-bottom: 15px;
}

.front p {
    color: #555;
    margin-bottom: 30px;
}

button {
    background: #e84375;
    color: white;
    border: none;
    padding: 14px 30px;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #c72c60;
    transform: scale(1.05);
}

.inside {
    display: none;
    animation: appear 1s ease;
}

.inside h1 {
    color: #e84375;
    font-size: 25px;
    margin-bottom: 25px;
}

.inside p {
    color: #444;
    line-height: 1.7;
    margin-bottom: 15px;
}

.hello {
    font-weight: bold;
    font-size: 20px;
}

.info {
    background: #fff0f5;
    padding: 15px;
    border-radius: 15px;
    margin: 20px 0;
}

.inside h3 {
    color: #e84375;
    margin: 20px 0;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
} 
  </style>  

    <div class="container">

        <div class="card" id="card">

            <div class="front">
                <h1>💌</h1>
                <h2>Сизди чакырабыз!</h2>
                <p>Өзгөчө күнүмө конок болуңуз</p>

                <button onclick="openCard()">
                    Катты ачуу
                </button>
            </div>

            <div class="inside">
                <h1>🎉 ЧАКЫРУУ КАТ 🎉</h1>

                <p class="hello">Урматтуу Бегислан агай!</p>

                <p>
                    Сизди менин туулган күнүмө
                    арналган майрамдык кечеге
                    чакырам!
                </p>

                <div class="info">
                    <p>📅 Күнү: 18-декабрь, 2026</p>
                    <p>⏰ Убактысы: 18:00</p>
                    <p>📍 Дареги: Ош шаары</p>
                </div>

                <p>
                    Сиздин келишиңиз биз үчүн
                    чоң кубаныч!
                </p>

                <h3>Сизди күтөбүз! ❤️</h3>

                <button onclick="confirmInvite()">
                    Катышам!
                </button>
            </div>

        </div>

    </div>
      <script>
          function openCard() {

    document.querySelector(".front").style.display = "none";

    document.querySelector(".inside").style.display = "block";

}

function confirmInvite() {

    alert("Рахмат! Сизди майрамда күтөбүз! ❤️");

}</script>
  </body>
</html>
